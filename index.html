<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">

    <!-- Nav Component -->
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-brand">Dashboard</div>
      <ul class="nav-list" role="tablist">
        <li>
          <button
            class="nav-item"
            data-section="greeting"
            role="tab"
            aria-selected="false"
            aria-controls="greeting"
          >
            <span class="nav-icon">🌤</span>
            <span class="nav-label">Greeting</span>
          </button>
        </li>
        <li>
          <button
            class="nav-item"
            data-section="timer"
            role="tab"
            aria-selected="false"
            aria-controls="timer"
          >
            <span class="nav-icon">⏱</span>
            <span class="nav-label">Focus Timer</span>
          </button>
        </li>
        <li>
          <button
            class="nav-item"
            data-section="todo"
            role="tab"
            aria-selected="false"
            aria-controls="todo"
          >
            <span class="nav-icon">✅</span>
            <span class="nav-label">To-Do List</span>
          </button>
        </li>
        <li>
          <button
            class="nav-item"
            data-section="links"
            role="tab"
            aria-selected="false"
            aria-controls="links"
          >
            <span class="nav-icon">🔗</span>
            <span class="nav-label">Quick Links</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Section: Greeting -->
      <section
        id="greeting"
        class="section"
        role="tabpanel"
        aria-labelledby="nav-greeting"
        aria-hidden="true"
      >
        <div class="greeting-container">
          <p id="greeting-message" class="greeting-message">Good Morning</p>
          <h1 id="greeting-time" class="greeting-time">00:00</h1>
          <p id="greeting-date" class="greeting-date">Monday, 28 July 2025</p>
        </div>
      </section>

      <!-- Section: Focus Timer -->
      <section
        id="timer"
        class="section"
        role="tabpanel"
        aria-labelledby="nav-timer"
        aria-hidden="true"
      >
        <div class="timer-container">
          <h2 class="section-title">Focus Timer</h2>
          <div class="timer-display" id="timer-display" aria-live="polite">30:00</div>
          <div class="timer-controls">
            <button id="timer-start" class="btn btn--primary">Start</button>
            <button id="timer-stop" class="btn btn--secondary">Stop</button>
            <button id="timer-reset" class="btn btn--ghost">Reset</button>
          </div>
        </div>
      </section>

      <!-- Section: To-Do List -->
      <section
        id="todo"
        class="section"
        role="tabpanel"
        aria-labelledby="nav-todo"
        aria-hidden="true"
      >
        <div class="todo-container">
          <h2 class="section-title">To-Do List</h2>
          <form id="task-form" class="task-form" novalidate>
            <input
              id="task-input"
              class="text-input"
              type="text"
              placeholder="Add a new task…"
              aria-label="New task label"
              autocomplete="off"
            />
            <button type="submit" class="btn btn--primary">Add</button>
          </form>
          <ul id="task-list" class="task-list" aria-label="Task list"></ul>
        </div>
      </section>

      <!-- Section: Quick Links -->
      <section
        id="links"
        class="section"
        role="tabpanel"
        aria-labelledby="nav-links"
        aria-hidden="true"
      >
        <div class="links-container">
          <div class="links-header">
            <h2 class="section-title">Quick Links</h2>
            <button id="add-link-btn" class="btn btn--primary">+ Add Link</button>
          </div>

          <!-- Add Link Form (hidden by default) -->
          <form id="link-form" class="link-form link-form--hidden" novalidate>
            <div class="form-group">
              <label for="link-name-input" class="form-label">Name</label>
              <input
                id="link-name-input"
                class="text-input"
                type="text"
                placeholder="e.g. GitHub"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="link-url-input" class="form-label">URL</label>
              <input
                id="link-url-input"
                class="text-input"
                type="url"
                placeholder="https://…"
                autocomplete="off"
              />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Save</button>
              <button type="button" id="link-form-cancel" class="btn btn--ghost">Cancel</button>
            </div>
          </form>

          <div id="links-grid" class="links-grid" aria-label="Quick links grid"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
